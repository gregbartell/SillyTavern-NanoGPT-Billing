<div id="chat-completion-billing-settings" class="extension_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Chat Completion Billing</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="chat_completion_billing_enabled">
                <input id="chat_completion_billing_enabled" type="checkbox" />
                <span>Show provider-reported billing on messages</span>
            </label>
            <small id="chat_completion_billing_warning" class="chat-completion-billing-warning" hidden>
                Required core metadata hook is unavailable.
            </small>
        </div>
    </div>
</div>
