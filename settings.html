<div id="nanogpt-billing-settings" class="extension_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>NanoGPT Billing</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="nanogpt_billing_enabled">
                <input id="nanogpt_billing_enabled" type="checkbox" />
                <span>Show NanoGPT billing on messages</span>
            </label>
            <small id="nanogpt_billing_warning" class="nanogpt-billing-warning" hidden>
                Required core metadata hook is unavailable.
            </small>
        </div>
    </div>
</div>
